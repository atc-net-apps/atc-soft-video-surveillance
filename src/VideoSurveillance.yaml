openapi: "3.2.0"
info:
  version: 1.0.0
  title: AtcSoft Video Surveillance API
  description: REST API for headless video surveillance — camera management, recording, and live streaming.
  license:
    name: MIT

# Every operation needs a signed-in user (the access token) or an API key; the
# sign-in operations say security: [] themselves. x-authorize-roles narrows an
# operation to operators or admins.
security:
  - bearer: []
  - apiKey: []

paths:
  /auth/setup:
    get:
      summary: Whether the server still needs its first admin
      operationId: getSetupStatus
      security: []
      tags:
        - auth
      responses:
        '200':
          description: The setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      summary: Create the first admin
      description: >-
        Only while the server has no user. The setup code is in the file setup-code.txt in the server's data folder,
        so only someone who can read the server's disk can create the first admin.
      operationId: completeSetup
      # Not a change for the audit log: sign-in writes its own entries, a lease renewal is no change.
      x-audit: false
      security: []
      x-retry-enabled: false
      # Guessing passwords or the setup code: ten tries a minute from one address.
      x-ratelimit-policy: sign-in
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSetupRequest"
      responses:
        '200':
          description: The first admin is created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        '400':
          description: The setup code is not right
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: The server has users already
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many tries from this address; Retry-After says when to try again.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/token:
    post:
      summary: Sign in
      operationId: createSession
      # Not a change for the audit log: sign-in writes its own entries, a lease renewal is no change.
      x-audit: false
      security: []
      x-retry-enabled: false
      # Guessing passwords or the setup code: ten tries a minute from one address.
      x-ratelimit-policy: sign-in
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        '400':
          description: The user name or the password is not right (which of them is not said)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many tries from this address; Retry-After says when to try again.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/refresh:
    post:
      summary: Renew a session
      description: Gives a new access token and a new refresh token for a refresh token, which can then not be used again.
      operationId: refreshSession
      # Not a change for the audit log: sign-in writes its own entries, a lease renewal is no change.
      x-audit: false
      security: []
      x-retry-enabled: false
      # A refresh token cannot be guessed, so not the sign-in limit: the web client renews its
      # session on every page load (the access token is kept in memory only), and ten loads a
      # minute from one address (an office behind one address) signed browsers out.
      x-ratelimit-policy: session-renewal
      x-ratelimit-permit-limit: 60
      x-ratelimit-window-seconds: 60
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        '200':
          description: The session is renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        '400':
          description: The refresh token is not known, or has run out; sign in again
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many tries from this address; Retry-After says when to try again.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/sign-out:
    post:
      summary: Sign out
      description: Ends the session the refresh token belongs to. One that is already gone is no error.
      operationId: endSession
      # Not a change for the audit log: sign-in writes its own entries, a lease renewal is no change.
      x-audit: false
      security: []
      x-retry-enabled: false
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        '204':
          description: Signed out

  /auth/me:
    get:
      summary: The signed-in user
      operationId: getCurrentUser
      tags:
        - auth
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/me/password:
    put:
      summary: Change the signed-in user's own password
      description: Needs the current password. The user's sessions end, so other devices sign in again.
      operationId: updateOwnPassword
      x-retry-enabled: false
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        '204':
          description: Changed
        '400':
          description: The current password is not right
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /users:
    get:
      summary: List the users
      operationId: listUsers
      x-authorize-roles:
        - admin
      tags:
        - users
      responses:
        '200':
          description: The users, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      summary: Add a user
      operationId: createUser
      x-retry-enabled: false
      x-authorize-roles:
        - admin
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        '201':
          description: The user is added
          headers:
            Location:
              description: Where the new one is.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: A user has that name already
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /users/{userId}:
    put:
      summary: Change a user's role or password
      description: What the request leaves out stays. A new password ends the user's sessions. The last admin keeps the role.
      operationId: updateUser
      x-retry-enabled: false
      x-authorize-roles:
        - admin
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        '200':
          description: The user is changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: The server always keeps one admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Remove a user
      description: Their sessions end. The last admin cannot be removed.
      operationId: deleteUser
      x-retry-enabled: false
      x-authorize-roles:
        - admin
      tags:
        - users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: The server always keeps one admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api-keys:
    get:
      summary: List the API keys
      description: Their names and roles; a key itself is shown only when it is made.
      operationId: listApiKeys
      x-authorize-roles:
        - admin
      tags:
        - users
      responses:
        '200':
          description: The API keys, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      summary: Make an API key
      description: For an integration (Home Assistant, a script). The key is in the answer once; the server keeps only its hash.
      operationId: createApiKey
      x-retry-enabled: false
      x-authorize-roles:
        - admin
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        '201':
          description: The key is made
          headers:
            Location:
              description: Where the new one is.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api-keys/{keyId}:
    delete:
      summary: Remove an API key
      operationId: deleteApiKey
      x-retry-enabled: false
      x-authorize-roles:
        - admin
      tags:
        - users
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: API key not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /audit:
    get:
      summary: What was changed, by whom
      description: The latest changes first. Sign-ins, refused ones too, are in it; watching and renewing a stream are not.
      operationId: listAuditEntries
      x-authorize-roles:
        - admin
      tags:
        - users
      parameters:
        - name: take
          in: query
          required: false
          description: How many (100 when left out).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: The latest changes first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Only an admin may
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras:
    get:
      summary: List all cameras
      operationId: listCameras
      tags:
        - cameras
      responses:
        '200':
          description: A list of cameras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"
    post:
      summary: Add a new camera
      operationId: createCamera
      x-authorize-roles:
        - operator
        - admin
      tags:
        - cameras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCameraRequest"
      responses:
        '201':
          description: Camera created
          headers:
            Location:
              description: The new resource's address.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}:
    get:
      summary: Get camera by ID
      operationId: getCameraById
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Camera details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    put:
      summary: Update a camera
      operationId: updateCamera
      x-authorize-roles:
        - operator
        - admin
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCameraRequest"
      responses:
        '200':
          description: Camera updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Delete a camera
      operationId: deleteCamera
      x-authorize-roles:
        - operator
        - admin
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Camera deleted
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/snapshot:
    get:
      summary: Capture a snapshot from a camera
      operationId: captureSnapshot
      x-authorize-roles:
        - operator
        - admin
      # A GET named capture: it also saves the picture, which "capture" says.
      x-atc-suppress: ATC_API_OPR003
      # A snapshot opens the camera's stream; a client in a loop would keep the
      # server opening streams. Twenty per ten seconds is more than a person clicks.
      x-ratelimit-policy: snapshots
      x-ratelimit-permit-limit: 20
      x-ratelimit-window-seconds: 10
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Snapshot image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many calls from this client; Retry-After says when to call again.
          headers:
            Retry-After:
              description: Seconds to wait before calling again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '503':
          description: Camera not connected
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/detect-connection-type:
    post:
      summary: Detect the camera's connection type (wired or Wi-Fi) via ONVIF
      description: >-
        Probes the camera with its stored credentials and returns the detected
        connection type without saving it. The client decides whether to apply
        it. Returns none when the camera does not support ONVIF, rejects the
        credentials, or reports an unknown interface type.
      operationId: detectConnectionType
      x-authorize-roles:
        - operator
        - admin
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTypeDetection"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/recording:
    post:
      summary: Start recording a camera
      operationId: startRecording
      x-authorize-roles:
        - operator
        - admin
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: Already recording
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Stop recording a camera
      operationId: stopRecording
      x-authorize-roles:
        - operator
        - admin
      # A DELETE named stop: it stops a recording; deleteRecording deletes a file.
      x-atc-suppress: ATC_API_OPR007
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/stream:
    post:
      summary: Start watching a camera live
      description: >-
        Takes a lease on the camera's HLS stream and answers when the stream can be played (up to a minute for a
        camera that is slow to deliver its first segment). The viewer renews the lease every renewSeconds and gives
        it back when it stops watching; a lease that is not renewed ends by itself, and the stream stops when the
        last lease on it is gone.
      operationId: startStream
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stream can be played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamLease"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '503':
          description: The stream could not be started (the camera cannot be opened, or gave no picture in time)
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/stream/{leaseId}:
    put:
      summary: Renew a stream lease
      description: A viewer still watching renews its lease; a lease the server does not have (it ended, or the server restarted) is not found, and the viewer starts the stream again.
      operationId: renewStreamLease
      # Not a change for the audit log: sign-in writes its own entries, a lease renewal is no change.
      x-audit: false
      # A PUT named renew: it changes nothing in the lease but how long it lasts.
      x-atc-suppress: ATC_API_OPR005
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: leaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Renewed
        '404':
          description: Lease not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Give a stream lease back
      description: The viewer stopped watching. A lease that is already gone is given back all the same.
      operationId: deleteStreamLease
      # Not a change for the audit log: sign-in writes its own entries, a lease renewal is no change.
      x-audit: false
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: leaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Given back

  /devices/usb:
    get:
      summary: List USB cameras visible to the server host
      operationId: listUsbDevices
      x-authorize-roles:
        - operator
        - admin
      # Enumerating the devices takes a moment; the list is kept 5 seconds, and
      # the server drops it as soon as a USB camera is plugged in or pulled out.
      # It is the same for every caller, so it is shared between them.
      x-cache-type: output
      x-cache-shared: true
      x-cache-policy: usb-devices
      x-cache-expiration-seconds: 5
      x-cache-tags:
        - usb-devices
      tags:
        - devices
      responses:
        '200':
          description: A list of USB camera descriptors currently enumerable on the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsbDeviceDescriptor"
        '503':
          description: USB enumeration is not supported on this host (e.g. headless Linux without v4l2 yet).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /layouts:
