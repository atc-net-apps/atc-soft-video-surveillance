name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # A PAT is used rather than GITHUB_TOKEN so the release pull request
          # triggers pr-validation.yml — events raised by GITHUB_TOKEN do not
          # trigger workflows. The fallback keeps releases working if the
          # secret is missing; the release PR then simply gets no CI run.
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}

  publish-nuget:
    name: Publish NuGet Package
    runs-on: windows-latest
    needs: release-please
    # NuGet publishing is off for now: no project is packable. Remove "false &&" to turn it back on.
    if: false && needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write   # required to mint the OIDC token NuGet exchanges for a key

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore AtcSoft.Video.Surveillance.slnx

      # Packs every project marked <IsPackable>true</IsPackable>. They must ship
      # together: each ProjectReference becomes a NuGet dependency pinned to the
      # same version, so publishing only the top package leaves it uninstallable.
      #
      # No -p:Version here: the version comes from Directory.Build.props, which
      # release-please stamped in the release commit. No -p:IsPackable=true
      # either: on a solution that would force the apps and tests to pack too.
      - name: Pack NuGet
        run: dotnet pack AtcSoft.Video.Surveillance.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --output ./nuget

      # Trusted Publishing: GitHub mints an OIDC token, NuGet.org validates it
      # against the publishing policy for this repository and workflow, and
      # returns a short-lived API key. No long-lived secret is stored here.
      - name: NuGet login (OIDC to short-lived key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: davidkallesen   # nuget.org username; not a secret

      - name: Push to NuGet.org
        run: |
          $packages = Get-ChildItem ./nuget -Filter *.nupkg
          if ($packages.Count -eq 0) { throw "No .nupkg files found in ./nuget" }
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      # --skip-duplicate turns every 409 into a warning and exit 0, including
      # rejections that are not duplicates at all. Two releases were published
      # this way with a green job and nothing on NuGet.org, because the old
      # LinkSoft.* id was blocked by another organisation's reserved prefix.
      # Assert the version really landed rather than trusting the push.
      #
      # Every package is checked, not just one: a single missing dependency
      # makes the whole set uninstallable just as surely as a missing top package.
      - name: Verify the packages are actually on NuGet.org
        run: |
          $version = "${{ needs.release-please.outputs.version }}"
          $ids = Get-ChildItem ./nuget -Filter *.nupkg |
            ForEach-Object { $_.Name -replace "\.$([regex]::Escape($version))\.nupkg$", '' }
          if ($ids.Count -eq 0) { throw "No packages to verify" }

          # 30 attempts x 30s = 15 minutes. The v1.2.2 release needed more than
          # the original 5 minutes: three packages appeared between attempts 7
          # and 9, and the last two arrived after the window had already closed,
          # failing a release that had in fact published everything.
          $pending = [System.Collections.Generic.List[string]]::new([string[]]$ids)
          for ($i = 1; $i -le 30 -and $pending.Count -gt 0; $i++) {
            foreach ($id in @($pending)) {
              $url = "https://api.nuget.org/v3-flatcontainer/$($id.ToLowerInvariant())/index.json"
              try {
                if ((Invoke-RestMethod -Uri $url).versions -contains $version) {
                  Write-Host "Confirmed $id $version"
                  [void]$pending.Remove($id)
                }
              } catch {
                # Not indexed yet (a brand-new package id returns 404 until it is).
              }
            }
            if ($pending.Count -gt 0) {
              Write-Host "Attempt ${i}: waiting on $($pending -join ', ')"
              Start-Sleep -Seconds 30
            }
          }
          if ($pending.Count -gt 0) {
            throw "Never appeared on NuGet.org: $($pending -join ', ') - the push reported success but did not publish them"
          }

  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write   # push to ghcr.io; only this job may

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # The server with its web client for linux/amd64 (PCs, most NAS) and linux/arm64 (Apple
      # silicon, Raspberry Pi, ARM NAS), tagged 1.4.0, 1.4 and latest, with an SBOM and provenance.
      - name: Build and push
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/atc-video-surveillance
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          # No emulation needed: the Dockerfile runs no command for the target architecture.
          docker buildx create --use --name multiarch
          minor="${VERSION%.*}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$minor" \
            --tag "$IMAGE:latest" \
            --sbom=true \
            --provenance=mode=max \
            --push \
            .

  build-installers:
    name: Build MSI (${{ matrix.name }})
    runs-on: windows-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CameraWall
            app: src/AtcSoft.Video.Surveillance.CameraWall.Wpf.App/AtcSoft.Video.Surveillance.CameraWall.Wpf.App.csproj
            publish_dir: publish-camerawall
            installer: setup/AtcSoft.Video.Surveillance.CameraWall.Installer/AtcSoft.Video.Surveillance.CameraWall.Installer.wixproj
            installer_bin: setup/AtcSoft.Video.Surveillance.CameraWall.Installer/bin
            artifact: msi-installer-camerawall
          - name: VideoSurveillance
            app: src/AtcSoft.Video.Surveillance.Wpf.App/AtcSoft.Video.Surveillance.Wpf.App.csproj
            publish_dir: publish-videosurveillance
            installer: setup/AtcSoft.Video.Surveillance.Installer/AtcSoft.Video.Surveillance.Installer.wixproj
            installer_bin: setup/AtcSoft.Video.Surveillance.Installer/bin
            artifact: msi-installer-videosurveillance
          # The server as a Windows service: self-contained, as a service has nobody to tell
          # that a .NET runtime is missing.
          - name: Server
            app: src/AtcSoft.Video.Surveillance.Api/AtcSoft.Video.Surveillance.Api.csproj
            publish_args: --runtime win-x64 --self-contained true
            publish_dir: publish-server
            installer: setup/AtcSoft.Video.Surveillance.Server.Installer/AtcSoft.Video.Surveillance.Server.Installer.wixproj
            installer_bin: setup/AtcSoft.Video.Surveillance.Server.Installer/bin
            artifact: msi-installer-server

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Application
        run: dotnet publish ${{ matrix.app }} --configuration ${{ env.CONFIGURATION }} --output ./${{ matrix.publish_dir }} ${{ matrix.publish_args }}

      - name: Download FFmpeg
        run: |
          # The FFmpeg the engine needs (FFmpegRuntime.ReleaseVersion): bindings 9.0.2
          # load only FFmpeg 9 (avutil-61). The GitHub mirror of gyan.dev keeps every
          # release (gyan.dev itself deletes old ones), and the checksum is the one
          # FFmpegInstaller.Package checks. Keep the three in step.
          $ffmpegUrl = "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build-shared.zip"
          $ffmpegSha256 = "8d31e162f1616e37aab3fa2db991b97e1b8dbeb1c8465fd81a81be16ff91b328"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $ffmpegSha256) { throw "FFmpeg download checksum $actual, expected $ffmpegSha256" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp
          $binDir = Get-ChildItem -Path ffmpeg-temp -Recurse -Directory -Filter "bin" | Select-Object -First 1
          New-Item -ItemType Directory -Path "./${{ matrix.publish_dir }}/ffmpeg" -Force
          # The DLLs for the engine, ffmpeg.exe for the server's live streams.
          Copy-Item "$($binDir.FullName)\*.dll" -Destination "./${{ matrix.publish_dir }}/ffmpeg/"
          Copy-Item "$($binDir.FullName)\ffmpeg.exe" -Destination "./${{ matrix.publish_dir }}/ffmpeg/"

      # No -p:ProductVersion here: it comes from setup/Directory.Build.props.
      - name: Build Installer
        run: dotnet build ${{ matrix.installer }} --configuration ${{ env.CONFIGURATION }} -p:PublishDir=${{ github.workspace }}/${{ matrix.publish_dir }}

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer_bin }}/${{ env.CONFIGURATION }}/*.msi
          retention-days: 5

  # The web client's files, for hosting it apart from the server (the server serves it itself),
  # and the web.config for IIS as a reverse proxy in front of the Windows service.
  build-web-client:
    name: Build web client zip
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish and zip
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          dotnet publish src/AtcSoft.Video.Surveillance.Blazor.App --configuration ${{ env.CONFIGURATION }} --output ./web-client
          mkdir -p ./assets
          cp docker/web-client-README.txt ./web-client/wwwroot/README.txt
          (cd ./web-client/wwwroot && zip -r -q "../../assets/AtcSoft.Video.Surveillance.WebClient-$VERSION.zip" .)
          cp setup/iis/web.config ./assets/AtcSoft.Video.Surveillance.IIS.web.config

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-web
          path: ./assets/*
          retention-days: 5

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [release-please, build-installers, build-web-client]
    if: needs.release-please.outputs.release_created == 'true'

    steps:
      - name: Download MSI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msi-installer-*
          merge-multiple: true
          path: ./msi

      - name: Download the web client and the IIS web.config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-web
          path: ./web

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ./msi/*.msi ./web/* --clobber --repo "${{ github.repository }}"
